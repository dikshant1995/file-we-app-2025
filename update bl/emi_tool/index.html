<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Loan EMI Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header>
            <div class="logo-area">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
                    </svg>
                </div>
                <h1>Loan EMI <span>Calculator</span></h1>
            </div>
            <div class="header-actions">
                <button id="resetBtn" class="icon-btn" title="Reset">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="grid-layout">
            <!-- Left Panel: Inputs -->
            <section class="input-card glass-panel">
                <div class="input-group">
                    <div class="label-row">
                        <label for="loanAmount">Loan Amount</label>
                        <span class="value-display">₹ <span id="loanAmountValue">10,00,000</span></span>
                    </div>
                    <input type="range" id="loanAmountSlider" min="100000" max="10000000" step="50000" value="1000000" class="premium-slider">
                    <div class="input-wrapper">
                        <span class="prefix">₹</span>
                        <input type="number" id="loanAmountInput" value="1000000">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="interestRate">Interest Rate (p.a.)</label>
                        <span class="value-display"><span id="interestRateValue">10.5</span>%</span>
                    </div>
                    <input type="range" id="interestRateSlider" min="1" max="30" step="0.1" value="10.5" class="premium-slider">
                    <div class="input-wrapper">
                        <input type="number" id="interestRateInput" value="10.5" step="0.1">
                        <span class="suffix">%</span>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="loanTenure">Loan Tenure</label>
                        <span class="value-display"><span id="loanTenureValue">5</span> Years</span>
                    </div>
                    <div class="tenure-toggle">
                        <button class="toggle-btn active" data-unit="years">Years</button>
                        <button class="toggle-btn" data-unit="months">Months</button>
                    </div>
                    <input type="range" id="loanTenureSlider" min="1" max="30" step="1" value="5" class="premium-slider">
                    <div class="input-wrapper">
                        <input type="number" id="loanTenureInput" value="5">
                        <span class="suffix" id="tenureSuffix">Years</span>
                    </div>
                </div>
            </section>

            <!-- Middle Panel: Visual Summary -->
            <section class="summary-card glass-panel">
                <div class="chart-container">
                    <canvas id="emiChart"></canvas>
                    <div class="chart-center">
                        <span class="label">Monthly EMI</span>
                        <span class="amount" id="monthlyEMI">₹0</span>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-item principal">
                        <div class="dot"></div>
                        <span class="label">Principal Amount</span>
                        <span class="value" id="totalPrincipal">₹0</span>
                    </div>
                    <div class="stat-item interest">
                        <div class="dot"></div>
                        <span class="label">Total Interest</span>
                        <span class="value" id="totalInterest">₹0</span>
                    </div>
                    <div class="stat-item total">
                        <span class="label">Total Amount Paid</span>
                        <span class="value" id="totalAmount">₹0</span>
                    </div>
                </div>

                <button id="viewDetailsBtn" class="primary-btn">
                    <span>View Amortization Schedule</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 13l5 5 5-5M7 6l5 5 5-5" />
                    </svg>
                </button>
            </section>

            <!-- Bottom Section: Amortization Table (Hidden initially or scrolls) -->
            <section class="details-card glass-panel" id="detailsSection">
                <div class="details-header">
                    <h2>Amortization Schedule</h2>
                    <button class="close-btn" id="closeDetailsBtn">×</button>
                </div>
                <div class="table-wrapper">
                    <table id="amortizationTable">
                        <thead>
                            <tr>
                                <th>Month</th>
                                <th>Principal</th>
                                <th>Interest</th>
                                <th>Total Payment</th>
                                <th>Balance</th>
                            </tr>
                        </thead>
                        <tbody id="amortizationBody">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
